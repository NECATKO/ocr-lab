[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-now"
version = "0.1.0"
description = "Taranmış kitap sayfalarını Word/TXT'ye çeviren yerel OCR hattı"
requires-python = ">=3.12"
dependencies = ["pypdfium2", "pillow", "python-docx"]

[project.optional-dependencies]
lab = ["marimo"]
dev = ["pytest"]

[project.scripts]
ocr-now = "ocrnow.cli:main"
ocr-lab = "ocrnow.lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
